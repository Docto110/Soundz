name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          bash scripts/patch-android.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Soundz-1.${BUILD_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v1.${BUILD_NUMBER}" "$APK" \
            --title "Soundz 1.${BUILD_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
